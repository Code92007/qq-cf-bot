[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-cf-bot"
version = "0.1.0"
description = "OneBot QQ group bot that pushes non-repeating Chinese Codeforces problems."
requires-python = ">=3.9"
dependencies = [
    "markdown>=3.6",
    "playwright>=1.46.0",
]

[project.scripts]
qq-cf-bot = "qq_cf_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]
